services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tracerag-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evallens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evallens_secret}
      POSTGRES_DB: ${POSTGRES_DB:-evallens}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evallens}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracerag-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-evallens}:${POSTGRES_PASSWORD:-evallens_secret}@db:5432/${POSTGRES_DB:-evallens}}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tracerag-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
